name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Import signing certificate
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$SIGNING_CERTIFICATE_P12" ]; then
            echo "SIGNING_CERTIFICATE_P12 secret is not set" >&2
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          printf '%s' "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN" >/dev/null
          # codesign looks up identities through the search list, even with --keychain.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -p codesigning "$KEYCHAIN" | awk '/ 1\) / {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "No code-signing identity in SIGNING_CERTIFICATE_P12" >&2
            exit 1
          fi
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build, test, and package
        run: ./scripts/release.sh

      - name: Generate signed appcast
        env:
          ED25519_PRIVATE_KEY: ${{ secrets.ED25519_PRIVATE_KEY }}
          SPARKLE_VERSION: "2.10.0"
          SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c
        run: |
          set -euo pipefail
          ZIP=$(ls dist/*.zip)
          VERSION=$(basename "$ZIP" .zip)
          VERSION=${VERSION#FlowerPassword-}
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle" ./bin/generate_appcast
          STAGE="$RUNNER_TEMP/appcast"
          mkdir "$STAGE"
          cp "$ZIP" "$STAGE/"
          printf '%s' "$ED25519_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/v$VERSION/" \
            "$STAGE"
          # generate_appcast only warns and exits 0 when the private key does
          # not match SUPublicEDKey, leaving an appcast the app would reject.
          grep -q 'sparkle:edSignature=' "$STAGE/appcast.xml" || {
            echo "appcast.xml has no EdDSA signature: ED25519_PRIVATE_KEY does not match SUPublicEDKey" >&2
            exit 1
          }
          cp "$STAGE/appcast.xml" dist/appcast.xml

      - name: Upload build artifact (dry run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v7
        with:
          name: FlowerPassword
          # Deliberately excludes appcast.xml: dry runs should not leave signed,
          # installable update entries in artifact storage.
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP=$(ls dist/*.zip)
          VERSION=${ZIP#dist/FlowerPassword-}
          VERSION=${VERSION%.zip}
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $VERSION" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
            for asset in "$(basename "$ZIP")" appcast.xml; do
              if ! printf '%s\n' "$assets" | grep -Fqx "$asset"; then
                echo "Release $GITHUB_REF_NAME exists but is missing $asset;" >&2
                echo "a partial publish cannot be repaired by re-running (a rebuilt" >&2
                echo "archive would not match the published one). Delete the release" >&2
                echo "with 'gh release delete $GITHUB_REF_NAME' and re-run." >&2
                exit 1
              fi
            done
            echo "Release $GITHUB_REF_NAME already exists with all assets; skipping creation"
            exit 0
          fi
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^$GITHUB_REF_NAME$" | head -n1)
          {
            echo "Requires macOS 14 or later. Universal binary (Apple Silicon and Intel)."
            echo
            echo "The app is not notarized; see the README for the one-time Gatekeeper steps."
            echo "Installs of 1.2.27 or later update in place via \"Check for Updates\" in the menu;"
            echo "earlier installs must update manually (see the README). The download is verified"
            echo "against the Ed25519 signature in the \`appcast.xml\` asset."
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "## What's Changed"
              echo
              git log "$PREV_TAG..$GITHUB_REF_NAME" --pretty=format:'- %s' --no-merges
              echo
              echo
            fi
            echo "## SHA-256"
            echo
            echo '```'
            shasum -a 256 "$ZIP" | sed 's|dist/||'
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$ZIP" dist/appcast.xml --title "$GITHUB_REF_NAME" --notes-file notes.md

      - name: Check out Homebrew tap
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v7
        with:
          repository: xlsdg/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - name: Update Homebrew cask
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          ZIP=$(ls dist/*.zip)
          VERSION=$(basename "$ZIP" .zip)
          VERSION=${VERSION#FlowerPassword-}
          SHA256=$(shasum -a 256 "$ZIP" | awk '{print $1}')
          CASK=tap/Casks/flower-password.rb
          sed -i '' \
            -e "s/^  version \".*\"$/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"$/  sha256 \"$SHA256\"/" \
            "$CASK"
          grep -q "version \"$VERSION\"" "$CASK"
          grep -q "sha256 \"$SHA256\"" "$CASK"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/flower-password.rb
          git diff --cached --quiet || git commit -m "chore: bump flower-password to $VERSION"
          git push
